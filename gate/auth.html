<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ateno — sign in</title>
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/gate.css">
</head>
<body>
<main>
  <img class="logo" src="/static/logo.png" alt="Ateno">
  <section id="wait"><p id="waittext"></p></section>
  <section id="device" hidden><h1 id="dtitle"></h1><p id="dtext"></p><p class="small"><a id="again2" href="/en/"></a></p></section>
  <section id="fail" hidden><h1 id="ftitle"></h1><p id="ftext"></p><p class="small"><a id="again" href="/en/"></a></p></section>
</main>
<script type="module">
import { auth, $, EMAIL_KEY, NONCE_KEY } from "/static/app.js";
import { isSignInWithEmailLink, signInWithEmailLink } from "https://www.gstatic.com/firebasejs/{{SDK}}/firebase-auth.js";

// The sign-in link from the email lands here: sign in, then go back to the page that asked for it.
const q = new URLSearchParams(location.search);
const ru = (q.get("lang") || "").startsWith("ru");
const L = ru ? {
  wait: "Входим…", dtitle: "Откройте ссылку там, где её запросили",
  dtext: "Ради безопасности ссылка работает только на том устройстве и в том браузере, где вы её запросили. Пересланные письма не открываются.",
  again2: "Запросить ссылку на этом устройстве", ftitle: "Ссылка не сработала", ftext: "Она устарела или уже использована. Запросите новую.", again: "Запросить новую ссылку" }
: { wait: "Signing you in…", dtitle: "Open the link where you asked for it",
  dtext: "For security, the link only works on the device and browser where you requested it. Forwarded emails don't open.",
  again2: "Request a link on this device", ftitle: "This link didn't work", ftext: "It has expired or was already used. Request a new one.", again: "Request a new link" };
for (const k of ["waittext:wait", "dtitle", "dtext", "again2", "ftitle", "ftext", "again"]) { const [id, key] = k.split(":"); $(id).textContent = L[key || id]; }

// where to go after sign-in: ?next=/en/ (Firebase's own link page passes it through), or inside continueUrl
let back = "/en/";
const safe = p => typeof p === "string" && /^\/(en|ru|admin)\/$/.test(p);
let next = q.get("next");
try { if (!next) next = new URL(q.get("continueUrl") || "").searchParams.get("next"); } catch {}
if (safe(next)) back = next;
if (ru && back === "/en/") back = "/ru/";
$("again").href = back; $("again2").href = back;
const show = id => { for (const s of ["wait", "device", "fail"]) $(s).hidden = s !== id; };
let nonce = q.get("n");
try { if (!nonce) nonce = new URL(q.get("continueUrl") || "").searchParams.get("n"); } catch {}

async function finish(email) {
  show("wait");
  try {
    await signInWithEmailLink(auth, email.trim().toLowerCase(), location.href);
    localStorage.removeItem(EMAIL_KEY); localStorage.removeItem(NONCE_KEY);
    location.replace(back);
  } catch (e) { show("fail"); }
}
if (!isSignInWithEmailLink(auth, location.href)) location.replace(back);
// same browser that asked for the link (its one-time key matches), or nothing
else if (nonce && localStorage.getItem(NONCE_KEY) === nonce && localStorage.getItem(EMAIL_KEY)) finish(localStorage.getItem(EMAIL_KEY));
else show("device");
</script>
</body>
</html>
