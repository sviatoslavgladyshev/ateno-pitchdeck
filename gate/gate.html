<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{TITLE}}</title>
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/gate.css">
</head>
<body>
<main>
  <img class="logo" src="/static/logo.png" alt="Ateno">
  <section id="ask" hidden>
    <h1>{{T_TITLE}}</h1>
    <p>{{T_LEAD}}</p>
    <form id="form">
      <input id="email" type="email" autocomplete="email" required placeholder="name@company.com" aria-label="Email">
      <button id="send" type="submit">{{T_SEND}}</button>
    </form>
  </section>
  <section id="sent" hidden>
    <h1>{{T_SENT_TITLE}}</h1>
    <p>{{T_SENT}} <b id="sentto"></b>.</p>
    <p class="gap">{{T_SPAM}}</p>
  </section>
  <section id="denied" hidden>
    <h1>{{T_DENIED_TITLE}}</h1>
    <p>{{T_DENIED}}</p>
    <p class="gap"><b id="who"></b></p>
  </section>
  <section id="wait"><p>{{T_LOADING}}</p></section>
  <p class="msg" id="msg" role="status"></p>
  <p class="small">{{T_FOOT}} · <a href="{{OTHER_HREF}}">{{OTHER_LABEL}}</a><span id="outwrap" hidden> · <a href="#" id="out">{{T_SIGNOUT}}</a></span></p>
</main>
<script type="module">
import { auth, db, $, sendLink, currentUser, logout } from "/static/app.js";
import { doc, getDoc, setDoc, addDoc, collection, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/{{SDK}}/firebase-firestore.js";

const LANG = "{{LANG}}";
const T = { sendFail: "{{T_SEND_FAIL}}", error: "{{T_ERROR}}", shield: "{{T_SHIELD}}", print: "{{T_PRINT}}" };
const show = id => { for (const s of ["ask", "sent", "denied", "wait"]) $(s).hidden = s !== id; };
const say = (t, bad) => { $("msg").textContent = t || ""; $("msg").className = "msg" + (bad ? " bad" : ""); };

$("out").addEventListener("click", async e => { e.preventDefault(); await logout(); location.reload(); });

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("email").value.trim().toLowerCase();
  $("send").disabled = true; say("");
  try { await sendLink(email, LANG); $("sentto").textContent = email; show("sent"); }
  catch (err) { say(T.sendFail, true); }
  $("send").disabled = false;
});

const user = await currentUser();
if (!user || !user.emailVerified) show("ask");
else await openDeck(user);

async function openDeck(user) {
  const email = user.email.toLowerCase();
  let snap;
  try { snap = await getDoc(doc(db, "decks", LANG)); }
  catch (e) {
    if (e.code !== "permission-denied") { show("ask"); say(T.error, true); return; }
    // signed in, but not on the list: leave a request for the admin
    await setDoc(doc(db, "requests", email), { email, lang: LANG, at: serverTimestamp() }).catch(() => {});
    $("who").textContent = email; $("outwrap").hidden = false; show("denied"); return;
  }
  if (!new URLSearchParams(location.search).has("slides"))
    addDoc(collection(db, "views"), { email, lang: LANG, at: serverTimestamp(), ua: navigator.userAgent.slice(0, 399) }).catch(() => {});
  document.open(); document.write(snap.data().html); document.close();
  guard(email);
}

// ---------- after the deck is on screen: watermark + no printing, saving or copying ----------
function guard(email) {
  const d = document;
  const stamp = `${email} · ${new Date().toISOString().slice(0, 10)}`;
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const tile = `<svg xmlns='http://www.w3.org/2000/svg' width='560' height='300'><text x='20' y='170' transform='rotate(-22 280 150)' font-family='Arial,sans-serif' font-size='22' fill='rgb(128,128,128)' fill-opacity='.22'>${esc(stamp)}</text></svg>`;
  const css = d.createElement("style");
  css.textContent = `
    html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    #wm{position:fixed;inset:0;z-index:2147483646;pointer-events:none;background-image:url("data:image/svg+xml,${encodeURIComponent(tile)}")}
    #shield{position:fixed;inset:0;z-index:2147483647;background:#000;color:#86868b;display:none;align-items:center;justify-content:center;font:16px -apple-system,Arial,sans-serif}
    body.shielded #shield{display:flex}
    body.shielded #stage,body.shielded #presenter{filter:blur(40px)}
    @media print{html,body{display:none!important}}`;
  d.head.append(css);
  const wm = d.createElement("div"); wm.id = "wm"; wm.setAttribute("aria-hidden", "true");
  const sh = d.createElement("div"); sh.id = "shield"; sh.textContent = T.shield;
  d.body.append(wm, sh);
  // the watermark is put back if someone removes it in the developer tools
  new MutationObserver(() => { if (!wm.isConnected) d.body.append(wm); if (!sh.isConnected) d.body.append(sh); })
    .observe(d.body, { childList: true });

  let timer;
  const cover = (ms = 4000) => { d.body.classList.add("shielded"); clearTimeout(timer); timer = setTimeout(() => d.body.classList.remove("shielded"), ms); };
  addEventListener("keydown", e => {
    const k = (e.key || "").toLowerCase(), mod = e.metaKey || e.ctrlKey;
    if (mod && (k === "p" || k === "s")) { e.preventDefault(); e.stopImmediatePropagation(); say2(T.print); }
    // macOS screenshot shortcuts start with Cmd+Shift; Windows uses PrintScreen and Win+Shift+S
    if ((e.metaKey && e.shiftKey) || k === "printscreen" || (e.shiftKey && e.getModifierState?.("OS"))) cover();
  }, true);
  addEventListener("keyup", e => { if ((e.key || "").toLowerCase() === "printscreen") { cover(); navigator.clipboard?.writeText("").catch(() => {}); } }, true);
  addEventListener("beforeprint", () => cover(60000));
  for (const ev of ["contextmenu", "dragstart", "selectstart", "copy", "cut"]) addEventListener(ev, e => e.preventDefault(), true);
  d.querySelectorAll("video").forEach(v => { v.disablePictureInPicture = true; v.setAttribute("controlslist", "nodownload noplaybackrate"); });
  function say2(t) { sh.textContent = t; cover(1500); setTimeout(() => (sh.textContent = T.shield), 1600); }
}
</script>
</body>
</html>
