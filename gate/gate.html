<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{TITLE}}</title>
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/gate.css">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="modulepreload" href="/static/app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/{{SDK}}/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/{{SDK}}/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/{{SDK}}/firebase-firestore.js">
</head>
<body>
<main>
  <img class="logo" src="/static/logo.png" alt="Ateno">
  <section id="confirm" hidden>
    <h1>{{T_CONFIRM_TITLE}}</h1>
    <p>{{T_CONFIRM}}</p>
    <form id="form">
      <input id="email" type="email" autocomplete="email" required placeholder="name@company.com" aria-label="Email">
      <button id="send" type="submit">{{T_OPEN}}</button>
    </form>
  </section>
  <section id="invite" hidden>
    <h1>{{T_INVITE_TITLE}}</h1>
    <p>{{T_INVITE}}</p>
  </section>
  <section id="blocked" hidden>
    <h1>{{T_BLOCKED_TITLE}}</h1>
    <p>{{T_BLOCKED}}</p>
  </section>
  <section id="wait"><span class="spin big" aria-hidden="true"></span><p>{{T_LOADING}}</p></section>
  <p class="msg" id="msg" role="status"></p>
  <p class="small">{{T_FOOT}} · <a href="{{OTHER_HREF}}" id="other">{{OTHER_LABEL}}</a></p>
</main>
<script type="module">
import { db, $, session, keyFor, hashParams } from "/static/app.js";
import { doc, getDoc, setDoc, addDoc, updateDoc, collection, serverTimestamp, runTransaction, writeBatch, arrayUnion }
  from "https://www.gstatic.com/firebasejs/{{SDK}}/firebase-firestore.js";

const LANG = "{{LANG}}", LIMIT = 3, ME = "ateno-pitch-me";
const T = { noMatch: "{{T_NO_MATCH}}", used: "{{T_USED}}", error: "{{T_ERROR}}", shield: "{{T_SHIELD}}", strike: "{{T_STRIKE}}",
            blockedTitle: "{{T_BLOCKED_TITLE}}", blocked: "{{T_BLOCKED}}" };
const show = id => { for (const s of ["confirm", "invite", "blocked", "wait"]) $(s).hidden = s !== id; };
const say = (t, bad) => { $("msg").textContent = t || ""; $("msg").className = "msg" + (bad ? " bad" : ""); };
const busy = on => { $("send").disabled = on; $("send").classList.toggle("loading", on); };

// keep the invitation in the language switch
const token = hashParams().get("i");
if (token) $("other").href += `#i=${encodeURIComponent(token)}`;

// The browser session starts in the background; the form is usable right away.
const userP = session();
let cached = null; try { cached = JSON.parse(localStorage.getItem(ME) || "null"); } catch {}

if (token) {
  show("confirm"); $("email").focus();
  $("form").addEventListener("submit", e => { e.preventDefault(); claim($("email").value.trim().toLowerCase()); });
  // while they type: open the connection to the database so the click only waits for the data
  userP.then(u => getDoc(doc(db, "admins", u.uid))).catch(() => {});
} else openDeck();

// Confirm the email: the invitation is only found with the right token AND email; this browser is then added to it.
async function claim(email) {
  busy(true); say("");
  try {
    const [id, user] = await Promise.all([keyFor(token, email), userP]);
    const ref = doc(db, "invites", id), grant = doc(db, "grants", user.uid);
    // fast path: one write adds this browser and points it at the invitation
    const b = writeBatch(db);
    b.update(ref, { devices: arrayUnion(user.uid) });
    b.set(grant, { inv: id, at: serverTimestamp() });
    try { await b.commit(); }
    catch (e) {
      // why did it fail? wrong email, all devices used, or this browser is already on the invitation
      const s = await getDoc(ref).catch(() => null);
      if (!s?.exists()) { say(T.noMatch, true); busy(false); return; }
      if (!s.data().devices.includes(user.uid)) { say(T.used, true); busy(false); return; }
      await setDoc(grant, { inv: id, at: serverTimestamp() });
    }
    localStorage.setItem(ME, JSON.stringify({ uid: user.uid, inv: id, email }));
    history.replaceState(null, "", location.pathname);   // the token leaves the address bar
    await openDeck({ email, keepButton: true });
  } catch (e) { say(T.error, true); busy(false); }
}

async function strikes(email) {
  try { const s = await getDoc(doc(db, "strikes", email)); return s.exists() ? s.data().count : 0; } catch { return 0; }
}

// Everything that can run at the same time does: admin check, deck, screenshot count.
async function openDeck(known = {}) {
  if (!known.keepButton) show("wait");
  let user;
  try { user = await userP; } catch { show("invite"); say(T.error, true); return; }
  let email = known.email || (cached?.uid === user.uid ? cached.email : null);
  const adminP = getDoc(doc(db, "admins", user.uid)).then(s => s.exists(), () => false);
  const deckP = getDoc(doc(db, "decks", LANG));
  deckP.catch(() => {});
  let usedP = email ? strikes(email) : null;

  let snap, isAdmin = await adminP;
  if (isAdmin) { email = "admin"; usedP = Promise.resolve(0); snap = await getDoc(doc(db, "decksFull", LANG)).catch(() => null); }
  else {
    snap = await deckP.catch(() => null);
    if (!email || !snap) {
      // no remembered invitation on this browser (or no access): look it up
      const g = await getDoc(doc(db, "grants", user.uid)).catch(() => null);
      const inv = g?.exists() ? await getDoc(doc(db, "invites", g.data().inv)).catch(() => null) : null;
      if (inv?.exists()) { email = inv.data().email; localStorage.setItem(ME, JSON.stringify({ uid: user.uid, inv: inv.id, email })); usedP = strikes(email); }
    }
  }
  if (!snap) {
    busy(false);
    if (email && usedP && await usedP >= LIMIT) { show("blocked"); return; }
    if (token) { say(T.error, true); return; }
    show("invite"); return;     // not invited, removed, reset or black-listed
  }
  // a short code for this viewing, hidden in the slides; /admin/ shows which email and time it belongs to
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint8Array(6));
  const code = [...r].map(x => A[x % A.length]).join("");
  const viewP = isAdmin || new URLSearchParams(location.search).has("slides") ? Promise.resolve(null)
    : addDoc(collection(db, "views"), { email, uid: user.uid, lang: LANG, code, at: serverTimestamp(), ua: navigator.userAgent.slice(0, 399) }).catch(() => null);
  const used = await (usedP || 0);
  if (!isAdmin) {
    localStorage.setItem("ateno-mode", "viewer");
    const q = new URLSearchParams(location.search);
    if (q.has("slides")) { q.delete("slides"); history.replaceState(null, "", location.pathname + (q.size ? "?" + q : "") + location.hash); }
  }
  document.open(); document.write(snap.data().html); document.close();
  guard(email, code, isAdmin, used);
  lazyMedia();
  viewP.then(ref => ref && track(ref));
}

// ---------- images and videos: the slide on screen and the next two first, the rest when idle ----------
function lazyMedia() {
  const d = document, slides = [...d.querySelectorAll(".slide")];
  // a video only starts downloading when its slide is on screen (or in the background pass below)
  const load = (s, video) => s && s.querySelectorAll("[data-src],[data-poster]").forEach(el => {
    if (el.dataset.poster) { el.setAttribute("poster", el.dataset.poster); delete el.dataset.poster; }
    if (el.dataset.src && (video || el.tagName !== "VIDEO")) { el.setAttribute("src", el.dataset.src); delete el.dataset.src; }
  });
  const active = () => Math.max(0, slides.findIndex(s => s.classList.contains("active")));
  const near = () => { const i = active(); load(slides[i], true); [i + 1, i + 2, i - 1].forEach(k => load(slides[k], false)); };
  // first open: the slide on screen gets the line to itself for a moment, then its neighbours
  const first = slides[active()];
  load(first, true);
  const deck = d.getElementById("deck");
  const watch = () => { near(); if (deck) new MutationObserver(near).observe(deck, { subtree: true, attributes: true, attributeFilter: ["class"] }); };
  // if they move before the pause is over, follow them right away
  const early = () => { if (slides[active()] !== first) { clearTimeout(timer); watch(); removeEventListener("hashchange", early); } };
  const timer = setTimeout(() => { removeEventListener("hashchange", early); watch(); }, 1500);
  addEventListener("hashchange", early);
  // background pass once the slide on screen can play without stalling (or after 8 s): images first, then videos
  let started = false;
  const rest = () => {
    if (started) return; started = true;
    slides.forEach((s, k) => setTimeout(() => load(s, false), 150 * k));
    setTimeout(() => slides.forEach(s => load(s, true)), 150 * slides.length + 1500);
    setTimeout(() => window.loadGridThumbs?.(), 150 * slides.length + 6000);   // overview thumbnails last
  };
  const v = slides[active()]?.querySelector("video");
  if (v && v.readyState < 4) { v.addEventListener("canplaythrough", rest, { once: true }); setTimeout(rest, 8000); }
  else setTimeout(rest, 1200);
}

// ---------- what they saw: seconds on each slide, saved to this view's log entry ----------
function track(ref) {
  const d = document, secs = {};
  let total = 0, dirty = false;
  setInterval(() => {
    if (d.visibilityState !== "visible") return;            // only count time the deck is actually on screen
    const id = d.querySelector(".slide.active")?.id;
    if (!id) return;
    secs[id] = (secs[id] || 0) + 1; total += 1; dirty = true;
  }, 1000);
  const save = () => {
    if (!dirty) return; dirty = false;
    updateDoc(ref, { slides: { ...secs }, seen: Object.keys(secs).length, dur: total, last: serverTimestamp() }).catch(() => {});
  };
  setInterval(save, 10000);
  d.addEventListener("visibilitychange", () => { if (d.visibilityState === "hidden") save(); });
  addEventListener("pagehide", save);
}

// ---------- after the deck is on screen ----------
function guard(email, code, admin, used) {
  const d = document;
  // Invisible watermark: the view code, tiled at ~3% grey. Not visible on screen; on a screenshot,
  // raise contrast/levels and it appears. It is unlikely to survive a photo of the screen.
  const tile = `<svg xmlns='http://www.w3.org/2000/svg' width='420' height='240'><text x='40' y='140' transform='rotate(-22 210 120)' font-family='Arial,sans-serif' font-weight='700' font-size='30' letter-spacing='4' fill='rgb(128,128,128)' fill-opacity='.035'>${code}</text></svg>`;
  const css = d.createElement("style");
  css.textContent = `
    html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    #wm{position:fixed;inset:0;z-index:2147483646;pointer-events:none;background-image:url("data:image/svg+xml,${encodeURIComponent(tile)}")}
    #shield{position:fixed;inset:0;z-index:2147483647;background:#000;color:#f5f5f7;display:none;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:24px;font:17px -apple-system,Arial,sans-serif}
    #shield small{color:#86868b;font-size:14px}
    body.shielded #shield{display:flex}
    body.shielded #stage,body.shielded #presenter{filter:blur(40px)}
    @media print{html,body{display:none!important}}
    ${admin ? "" : "#seg,#bpres,#notes,#remote,#start{display:none!important}"}`;
  d.head.append(css);
  const wm = d.createElement("div"); wm.id = "wm"; wm.setAttribute("aria-hidden", "true");
  const sh = d.createElement("div"); sh.id = "shield";
  d.body.append(wm, sh);
  new MutationObserver(() => { if (!wm.isConnected) d.body.append(wm); if (!sh.isConnected) d.body.append(sh); })
    .observe(d.body, { childList: true });

  let timer;
  const cover = (text, sub = "", ms = 4000) => {
    sh.innerHTML = ""; sh.append(Object.assign(d.createElement("div"), { textContent: text }));
    if (sub) sh.append(Object.assign(d.createElement("small"), { textContent: sub }));
    d.body.classList.add("shielded"); clearTimeout(timer);
    if (ms) timer = setTimeout(() => d.body.classList.remove("shielded"), ms);
  };

  // count an attempt; at LIMIT the deck is wiped from this tab and stops opening until the admin resets it
  let count = used, last = 0;
  async function strike(kind) {
    if (admin) return cover(T.shield, "(admin: not counted)", 2500);
    const now = Date.now(); if (now - last < 2500) return; last = now;   // one key press = one attempt
    count += 1;
    if (count >= LIMIT) wipe();
    else cover(T.shield, T.strike.replaceAll("{n}", count).replaceAll("{max}", LIMIT));
    try {
      await runTransaction(db, async tx => {
        const ref = doc(db, "strikes", email), s = await tx.get(ref);
        const n = s.exists() ? s.data().count + 1 : 1;
        tx.set(ref, { email, count: n, at: serverTimestamp(), kind });
        count = Math.max(count, n);
      });
    } catch {}
    if (count >= LIMIT) location.replace(location.pathname);   // reload: the sign-in page now shows "blocked"
  }
  function wipe() {
    d.documentElement.innerHTML = `<head><meta charset="utf-8"><title>Ateno</title><link rel="stylesheet" href="/static/gate.css"></head>
      <body><main><img class="logo" src="/static/logo.png" alt="Ateno"><h1></h1><p></p></main></body>`;
    d.querySelector("h1").textContent = T.blockedTitle; d.querySelector("p").textContent = T.blocked;
  }
  if (count >= LIMIT && !admin) return wipe();

  // Screenshot shortcuts: macOS Cmd+Shift+3/4/5 and Windows Win+Shift+S are taken by the system, so the page
  // sees Cmd/Win+Shift and then no other key. Normal shortcuts (Cmd+Shift+T…) deliver their key and don't count.
  let combo = false, other = false;
  addEventListener("keydown", e => {
    const k = (e.key || "").toLowerCase(), mod = e.metaKey || e.ctrlKey;
    // presenter view, displays, phone remote and notes: admin only
    if (!admin && !mod && !e.altKey && ["p", "d", "r", "n"].includes(k)) { e.stopImmediatePropagation(); return; }
    if (mod && (k === "p" || k === "s")) { e.preventDefault(); e.stopImmediatePropagation(); strike(k === "p" ? "print" : "save"); return; }
    if (k === "printscreen") { strike("printscreen"); return; }
    if (e.metaKey && e.shiftKey && (k === "meta" || k === "shift" || k === "os")) {
      if (!combo) { combo = true; other = false; cover(T.shield, "", 0); }
      return;
    }
    if (combo && !["meta", "shift", "os", "control", "alt"].includes(k)) other = true;
  }, true);
  addEventListener("keyup", e => {
    const k = (e.key || "").toLowerCase();
    if (k === "printscreen") { navigator.clipboard?.writeText("").catch(() => {}); strike("printscreen"); }
    if (combo && (k === "meta" || k === "shift" || k === "os")) {
      combo = false;
      if (!other) strike("screenshot"); else d.body.classList.remove("shielded");
    }
  }, true);
  addEventListener("beforeprint", () => { cover(T.shield, "", 60000); strike("print"); });
  for (const ev of ["contextmenu", "dragstart", "selectstart", "copy", "cut"]) addEventListener(ev, e => e.preventDefault(), true);
  d.querySelectorAll("video").forEach(v => { v.disablePictureInPicture = true; v.setAttribute("controlslist", "nodownload noplaybackrate"); });
}
</script>
</body>
</html>
