
</div></div>

<script>
(() => {
  const deck = document.getElementById('deck');
  const slides = [...deck.querySelectorAll('section.slide')];
  const N = slides.length;
  const $ = id => document.getElementById(id);
  const audience = new URLSearchParams(location.search).has('slides');   // the window shown on the projector
  const slidesId = new URLSearchParams(location.search).get('slides');
  let isPresenter = false;
  const chan = 'BroadcastChannel' in window ? new BroadcastChannel('ateno-deck') : null;
  const body = document.body;
  let cur = -1, atTimer;

  // check-circle icon used on result cards
  document.querySelectorAll('x-icon').forEach(el => {
    const s = el.getAttribute('style') || '';
    el.outerHTML = `<svg viewBox="0 0 24 24" style="${s};flex:none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  });

  // paint images only once decoded, so large figures never flash blank
  deck.querySelectorAll('img').forEach(i => { i.decoding = 'sync'; });

  const notesOf = s => (s.querySelector('aside')?.textContent || '').trim();
  const thumb = i => `thumbs/${slides[i].id}.jpg`;
  const titleOf = i => (slides[i].querySelector('h1,h2')?.textContent || slides[i].id).trim();

  // chapters come from data-section on the first slide of each part
  const chapters = [];
  slides.forEach((s, i) => {
    if (s.dataset.section || !chapters.length) chapters.push({ name: s.dataset.section || '', from: i, to: i });
    chapters[chapters.length - 1].to = i;
  });

  // ---------- scale to window ----------
  function fit() {
    const st = $('stage').getBoundingClientRect();
    const full = audience || !!document.fullscreenElement || (innerHeight >= screen.height - 1 && innerWidth >= screen.width - 1);
    body.classList.toggle('full', full && !isPresenter);
    const pad = isPresenter ? 16 : full ? 0 : innerWidth < 720 ? 6 : 24;
    const k = Math.min((st.width - pad * 2) / 1920, (st.height - pad * 2) / 1080);
    deck.style.transform = `translate(-50%,-50%) scale(${k})`;
  }
  addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);

  // ---------- build-in animations (step-by-step equations etc.) ----------
  function resetBuilds(s) {
    s.querySelectorAll('[data-build-in]').forEach(el => {
      const [kind] = el.dataset.buildIn.split(/\s+/);
      el.style.transition = 'none';
      el.style.opacity = 0;
      el.style.transform = kind === 'pop' ? 'scale(.85)' : kind === 'rise' ? 'translateY(28px)' : 'none';
    });
  }
  // Delays are CSS, not timers: browsers throttle timers in background windows, which left content hidden.
  // The presenter view always shows the whole slide at once.
  function playBuilds(s) {
    s.offsetWidth;
    s.querySelectorAll('[data-build-in]').forEach(el => {
      const order = parseInt(el.dataset.buildIn.split(/\s+/)[1] || '1', 10), d = 300 + order * 380;
      el.style.transition = isPresenter ? 'none' : `opacity .5s ease ${d}ms, transform .65s cubic-bezier(.34,1.45,.64,1) ${d}ms`;
      el.style.opacity = 1; el.style.transform = 'none';
    });
  }

  // ---------- media: restart GIFs and live embeds on entry ----------
  function countUp(s) {
    s.querySelectorAll('[data-count]').forEach(el => {
      const end = parseFloat(el.dataset.count), t0 = performance.now(), dur = 1400;
      if (isPresenter) { el.textContent = end.toLocaleString('en-US'); return; }
      const tick = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = Math.round(end * e).toLocaleString('en-US'); if (k < 1) requestAnimationFrame(tick); };
      el.textContent = '0'; setTimeout(() => requestAnimationFrame(tick), 450);
    });
  }
  function wakeMedia(s) {
    deck.querySelectorAll('video').forEach(v => { if (!s.contains(v)) { try { v.pause(); } catch (e) {} } });
    s.querySelectorAll('video').forEach(v => { try { v.currentTime = 0; const p = v.play(); if (p) p.catch(() => {}); } catch (e) {} });
    countUp(s);
    // a new fragment restarts a GIF while its last frame stays on screen; the presenter view leaves them running
    if (!isPresenter) s.querySelectorAll('img[src*=".gif"]').forEach(img => { img.src = `${img.getAttribute('src').split('#')[0]}#${Date.now()}`; });
    s.querySelectorAll('iframe[data-src]').forEach(f => { f.src = f.dataset.src; });
  }

  // ---------- navigation with transitions ----------
  function go(n, opts = {}) {
    n = Math.max(0, Math.min(N - 1, n));
    if (n === cur) return;
    const prev = cur >= 0 ? slides[cur] : null, next = slides[n];
    const fwd = n > cur;
    const kind = (fwd ? prev?.dataset.transition : next.dataset.transition) || 'fade';
    const leap = Math.abs(n - cur) > 1;       // jumps from the grid or scrubber always cross-fade
    resetBuilds(next);
    if (prev && kind === 'push' && !opts.instant && !leap && !isPresenter) {
      next.style.transition = 'none';
      next.style.transform = `translateX(${fwd ? 100 : -100}%)`;
      next.classList.add('active'); next.offsetWidth;
      next.style.transition = ''; next.style.transform = 'translateX(0)';
      prev.style.transform = `translateX(${fwd ? -100 : 100}%)`;
    } else {
      next.style.transform = '';
      if (prev && kind === 'magic' && !leap && !isPresenter) {
        prev.style.transition = 'opacity .3s, visibility 0s linear .3s';
        next.style.transition = 'opacity .3s, visibility 0s';
      }
      next.classList.add('active');
    }
    if (prev) {
      prev.classList.remove('active');
      const p = prev, q = next;
      setTimeout(() => { if (p !== slides[cur]) { p.style.transform = ''; p.style.transition = ''; } if (q === slides[cur]) q.style.transition = ''; }, 650);
    }
    cur = n;
    wakeMedia(next); playBuilds(next);
    $('count').innerHTML = `${n + 1} <i>/ ${N}</i>`;
    $('bprev').disabled = n === 0;
    $('bnext').disabled = n === N - 1;
    chapters.forEach((c, i) => {
      const done = Math.max(0, Math.min(c.to - c.from + 1, n - c.from + 1));
      fills[i].style.width = `${(done / (c.to - c.from + 1)) * 100}%`;
    });
    $('scrub').setAttribute('aria-valuenow', n + 1);
    $('notes').textContent = notesOf(next) || 'No notes for this slide.';
    $('pnotes').textContent = notesOf(next);
    renderNext();
    tiles.forEach((a, i) => a.classList.toggle('cur', i === n));
    if (!opts.fromHash) history.replaceState(null, '', `${location.search}#${n + 1}`);
    if (chan && !opts.remote) chan.postMessage({ type: 'go', n });
    if (remoteSeen && !opts.fromRemote) { clearTimeout(atTimer); atTimer = setTimeout(sayWhere, 400); }
  }
  const step = d => go(cur + d);

  // the next-slide preview is the real slide, scaled down, so it is as sharp as the slide itself
  function scaleNext() {
    const c = $('nextwrap').firstElementChild;
    if (c) c.style.transform = `scale(${$('nextwrap').clientWidth / 1920})`;
  }
  function renderNext() {
    if (!isPresenter) return;
    const wrap = $('nextwrap'), last = cur + 1 >= N;
    wrap.textContent = last ? 'End of talk' : '';
    wrap.classList.toggle('end', last);
    $('nextlab').textContent = last ? 'Next' : `Next · ${cur + 2} of ${N}`;
    if (last) return;
    const c = slides[cur + 1].cloneNode(true);
    c.removeAttribute('id'); c.setAttribute('aria-hidden', 'true');
    c.querySelectorAll('[data-build-in]').forEach(el => { el.removeAttribute('data-build-in'); el.style.opacity = ''; el.style.transform = ''; el.style.transition = ''; });
    c.querySelectorAll('iframe[data-src]').forEach(f => { f.src = f.dataset.src; });
    wrap.append(c); scaleNext();
  }
  addEventListener('resize', scaleNext);

  // ---------- chapter scrubber ----------
  const scrub = $('scrub'), peek = $('peek');
  scrub.setAttribute('aria-valuemin', 1); scrub.setAttribute('aria-valuemax', N);
  scrub.innerHTML = chapters.map(c => `<div class="ch" style="--n:${c.to - c.from + 1}"><b></b></div>`).join('');
  const fills = [...scrub.querySelectorAll('.ch b')];
  const segs = [...scrub.querySelectorAll('.ch')];
  function slideAtX(x) {
    for (let i = 0; i < chapters.length; i++) {
      const r = segs[i].getBoundingClientRect(), c = chapters[i], n = c.to - c.from + 1;
      if (x <= r.right + 1.5 || i === chapters.length - 1)
        return c.from + Math.max(0, Math.min(n - 1, Math.floor(((x - r.left) / r.width) * n)));
    }
    return 0;
  }
  function showPeek(x) {
    const i = slideAtX(x), r = scrub.getBoundingClientRect(), w = peek.offsetWidth;
    peek.querySelector('img').src = thumb(i);
    peek.querySelector('div').innerHTML = `<span>${i + 1}</span>`;
    peek.querySelector('div').append(titleOf(i));
    peek.style.left = `${Math.max(10, Math.min(innerWidth - w - 10, x - w / 2))}px`;
    peek.style.bottom = `${innerHeight - r.top + 12}px`;
    peek.classList.add('on');
  }
  let scrubbing = false;
  scrub.addEventListener('pointermove', e => { showPeek(e.clientX); if (scrubbing) go(slideAtX(e.clientX), { instant: true }); });
  scrub.addEventListener('pointerleave', () => { if (!scrubbing) peek.classList.remove('on'); });
  scrub.addEventListener('pointerdown', e => { scrubbing = true; scrub.setPointerCapture(e.pointerId); go(slideAtX(e.clientX)); });
  scrub.addEventListener('pointerup', () => { scrubbing = false; peek.classList.remove('on'); });
  scrub.addEventListener('pointercancel', () => { scrubbing = false; peek.classList.remove('on'); });

  // ---------- overview ----------
  $('gridin').innerHTML = chapters.map(c => {
    let h = `<h2>${c.name}</h2><div class="tiles">`;
    for (let i = c.from; i <= c.to; i++)
      h += `<a href="#${i + 1}" data-i="${i}"><img loading="lazy" src="${thumb(i)}" alt=""><span><b>${i + 1}</b><em style="font-style:normal">${titleOf(i)}</em></span></a>`;
    return h + '</div>';
  }).join('');
  const tiles = [...document.querySelectorAll('#grid a')];
  let sel = 0;
  const setSel = i => {
    sel = Math.max(0, Math.min(N - 1, i));
    tiles.forEach((a, j) => a.classList.toggle('sel', j === sel));
    tiles[sel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };
  const closeOverlays = () => body.classList.remove('show-grid', 'show-help', 'show-notes');
  const toggleGrid = () => {
    body.classList.remove('show-help');
    if (body.classList.toggle('show-grid')) {
      setSel(cur);
      tiles[cur].scrollIntoView({ block: 'center' });
    }
  };
  const openTile = i => { body.classList.remove('show-grid'); go(i); };
  $('grid').addEventListener('click', e => {
    e.stopPropagation();
    const a = e.target.closest('a');
    if (a) { e.preventDefault(); openTile(+a.dataset.i); }
    else body.classList.remove('show-grid');
  });
  const columns = () => {
    const t = tiles[sel].parentElement;
    return getComputedStyle(t).gridTemplateColumns.split(' ').length;
  };

  // ---------- controls ----------
  const toggle = c => body.classList.toggle(c);
  const fullOK = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  if (!fullOK) $('bfull').style.display = 'none';
  const actions = {
    bprev: () => step(-1),
    bnext: () => step(1),
    bgrid: toggleGrid,
    bfull: () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(),
    bpres: () => openStart()
  };
  Object.entries(actions).forEach(([id, fn]) => { $(id).onclick = e => { fn(); e.currentTarget.blur(); }; });
  const setBlack = (on, remote) => {
    body.classList.toggle('black', on);
    if (chan && !remote) chan.postMessage({ type: 'black', on });
  };

  // ---------- start sheet: modes and displays ----------
  // A browser only reaches a second display through the Window Management API (Chrome and Edge).
  // Without it, the window has to be dragged across by hand, and the sheet says so.
  const canPlace = 'getScreenDetails' in window;
  let details = null, target = null, access = canPlace ? 'prompt' : 'none', startNote = '';
  const allScreens = () => details?.screens || [];
  const screenName = s => s.label || (s.isInternal ? 'Built-in display' : 'External display');
  const pickTarget = () => {
    const l = allScreens();
    if (l.includes(target)) return;
    target = l.find(s => !s.isInternal && s !== details.currentScreen) || l.find(s => !s.isInternal) || l.find(s => s !== details.currentScreen) || l[0] || null;
  };
  function renderStart() {
    const l = allScreens(), many = l.length > 1;
    const ext = !!window.screen.isExtended;
    const ask = canPlace && !details && access === 'prompt' && ext;
    let msg = '';
    if (startNote) msg = startNote;
    else if (ask) msg = 'A second display is connected. Allow access to use it.';
    else if (access === 'denied') msg = 'Display access is blocked. Allow “Window management” in the site settings, or drag the slides across yourself.';
    else if (!canPlace) msg = 'This browser cannot reach a second display. Use Chrome or Edge, or drag the slides across yourself.';
    else if (!many) msg = 'One display found. To use another, set it to Extended in System Settings → Displays.';
    $('dstatus').textContent = msg;
    const picker = $('picker'); picker.textContent = '';
    if (many) l.forEach(s => {
      const b = document.createElement('button');
      const name = document.createElement('span'); name.textContent = screenName(s);
      b.append(name);
      b.className = 'rowi' + (s === target ? ' on' : '');
      b.setAttribute('aria-pressed', s === target);
      b.onclick = () => { target = s; renderStart(); };
      picker.append(b);
    });
    $('picklabel').hidden = !many;
    $('prow').hidden = !isPresenter;
    $('allow').hidden = !ask;
    $('modes').hidden = ask;
    $('mpres').textContent = isPresenter ? 'Move slides here' : 'Start presenting';
  }
  async function loadDisplays(ask) {
    if (!canPlace) return renderStart();
    if (!details) {
      try { access = (await navigator.permissions.query({ name: 'window-management' })).state; } catch { access = 'prompt'; }
      if (access === 'granted' || (access === 'prompt' && ask)) {
        try {
          details = await window.getScreenDetails();
          access = 'granted';
          details.addEventListener('screenschange', () => { pickTarget(); renderStart(); });
          details.addEventListener('currentscreenchange', () => { startNote = ''; renderStart(); });
        } catch { access = 'denied'; }
      }
    }
    if (details) pickTarget();
    renderStart();
  }
  function openStart(note = '') {
    startNote = note;
    closeOverlays(); body.classList.add('show-start');
    renderStart(); loadDisplays(false);
  }
  const closeStart = () => { startNote = ''; body.classList.remove('show-start'); };
  async function fullscreenOn(screen) {
    if (document.fullscreenElement) await document.exitFullscreen();
    await document.documentElement.requestFullscreen(screen ? { screen } : {});
  }
  // Presenter: this window stays put and becomes the presenter view; the slides open as a new
  // window on the projector. The presenter view can therefore never leave the laptop.
  // kept for this tab, so a refresh picks the running show back up
  let pw = null, slidesFull = false, slidesOn = sessionStorage.getItem('ateno-slides-on') || '', firstPressUsed = false;
  let slidesAlive = false, currentSlides = sessionStorage.getItem('ateno-slides-id') || '';
  let autoFull = localStorage.getItem('ateno-autofull') !== '0';
  const NEXT_KEYS = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'MediaTrackNext'];
  async function startPresenter() {
    const id = String(Date.now());
    const url = `${location.pathname}?slides=${id}#${cur + 1}`;
    const others = allScreens().filter(s => s !== target);
    if (!target || !others.length) {
      closeStart();
      if (canPlace && access !== 'denied') return setPresenter(true);        // one display: switch in place
      stopSlides(id);
      pw = window.open(url, `slides${id}`, 'popup,width=1280,height=720');    // moved to the other display by hand
      if (!pw) return openStart('The slides window was blocked. Allow pop-ups for this site, then try again.');
      slidesOn = ''; rememberSlides(id);
      return setPresenter(true);
    }
    if (target === details.currentScreen)
      return openStart(`Move this window to ${screenName(others[0])} first, or choose it for the slides.`);
    closeStart();
    stopSlides(id);
    pw = window.open(url, `slides${id}`, `popup,fullscreen,left=${target.availLeft},top=${target.availTop},width=${target.availWidth},height=${target.availHeight}`);
    if (!pw) return openStart('The slides window was blocked. Allow pop-ups for this site, then try again.');
    slidesOn = screenName(target); slidesFull = false; firstPressUsed = false;
    rememberSlides(id);
    window.focus();
    setPresenter(true);
  }
  // closes any slides window, including one left over from before a page reload
  function stopSlides(keep) {
    chan?.postMessage({ type: 'end', keep });
    pw?.close(); pw = null; slidesFull = false; slidesAlive = false;
    if (!keep) { currentSlides = ''; slidesOn = ''; sessionStorage.removeItem('ateno-slides-id'); sessionStorage.removeItem('ateno-slides-on'); }
  }
  function rememberSlides(id) {
    currentSlides = id;
    sessionStorage.setItem('ateno-slides-id', id);
    sessionStorage.setItem('ateno-slides-on', slidesOn);
  }

      const s = Math.floor(((held ?? Date.now()) - base) / 1000);
      $('timer').textContent = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
      $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    };
    setInterval(tick, 500); tick(); keep();
    $('tpause').onclick = () => {
      if (held === null) held = Date.now(); else { base += Date.now() - held; held = null; }
      keep();
    };
    $('treset').onclick = () => { base = Date.now(); if (held !== null) held = base; keep(); tick(); };
    const font = d => {
      size = Math.max(16, Math.min(40, size + d));
      localStorage.setItem('ateno-notes', size);
      document.documentElement.style.setProperty('--notes', size + 'px');
    };
    $('timer').onclick = () => $('tpause').onclick();
    $('tsmall').onclick = () => font(-2);
    $('tlarge').onclick = () => font(2);
  }
  const baseTitle = document.title;
  function setPresenter(on) {
    isPresenter = on;
    if (!audience) localStorage.setItem('ateno-mode', on ? 'presenter' : 'viewer');
    body.classList.toggle('presenter', on);
    document.title = on ? 'Presenter · ' + baseTitle : baseTitle;
    document.querySelectorAll('#seg button').forEach(b => {
      const active = (b.dataset.m === 'presenter') === on;
      b.classList.toggle('on', active); b.setAttribute('aria-pressed', active);
    });
    updateBanner();
    if (remoteSeen) { clearTimeout(atTimer); atTimer = setTimeout(sayWhere, 400); }
    if (on) { startClock(); renderNext(); playBuilds(slides[cur]); }
    fit(); wake();
  }

  // print: load embeds and show every slide
  addEventListener('beforeprint', () => slides.forEach(s => s.querySelectorAll('iframe[data-src]').forEach(f => { if (!f.src) f.src = f.dataset.src; })));

  addEventListener('hashchange', () => go((parseInt(location.hash.slice(1), 10) || 1) - 1, { fromHash: true }));
  const firstVisit = !location.hash && !audience && matchMedia('(hover:hover)').matches && window.screen.isExtended;
  fit();
  go((parseInt(location.hash.slice(1), 10) || 1) - 1, { fromHash: true, instant: true });
  body.classList.toggle('audience', audience);
  const resume = !audience && localStorage.getItem('ateno-mode') === 'presenter' && innerWidth > 720;
  if (!audience && room && localStorage.getItem('ateno-remote-on')) connectRemote();
  setPresenter(resume);
  if (resume) chan?.postMessage({ type: 'who' });      // is a slides window still open from before the refresh?
  fit();
  renderDevices();
  if (firstVisit && !resume) openStart();
  const ready = () => body.classList.add('ready');
  (document.fonts?.ready || Promise.resolve()).then(ready); setTimeout(ready, 1200);
})();
</script>
